<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数字时钟</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="clock" id="clock">
  <div class="clock__time">
    <span class="clock__hm" id="hm">--:--</span><span class="clock__sec" id="sec">:--</span>

</main>
<script type="module" src="app.js"></script>
</body>
</html>
